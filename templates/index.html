<!DOCTYPE html>
<html>
<head>
  <title>NYC Daymaker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
  <h1>NYC Daymaker</h1>

  <div id="controls">
    <label>Mood
      <select id="mood">
        <option>chill</option><option>adventurous</option><option>social</option><option>creative</option>
      </select>
    </label>

    <label>Hours
      <input id="hours" type="number" value="3" min="1" max="12">
    </label>

    <label>Budget
      <select id="budget">
        <option value="free">Free</option>
        <option value="low" selected>$</option>
        <option value="medium">$$</option>
      </select>
    </label>

    <label>Who's coming
      <select id="group">
        <option value="solo">Just me</option>
        <option value="date">Date</option>
        <option value="friends">Friends</option>
        <option value="kids">With kids</option>
      </select>
    </label>

    <label>
      <input id="accessible" type="checkbox"> Step-free / wheelchair accessible
    </label>

    <button onclick="getPlan()">Plan my day</button>
        <button id="offroute-btn" onclick="goOffRoute()" style="display:none">Take me off route</button>
  </div>

  <p id="weather"></p>
  <p id="result"></p>
  <div id="map"></div>

  <script>
    const map = L.map('map').setView([40.7128, -74.0060], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let markers = L.layerGroup().addTo(map);
    let currentStops = [];
    let currentLoc = null;

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text ?? '';
      return div.innerHTML;
    }

    function getSettings() {
      return {
        mood: document.getElementById('mood').value,
        hours: document.getElementById('hours').value,
        budget: document.getElementById('budget').value,
        group: document.getElementById('group').value,
        accessible: document.getElementById('accessible').checked
      };
    }

    function getLocation() {
      return new Promise(resolve => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          pos => resolve({
            lat: +pos.coords.latitude.toFixed(3),
            lng: +pos.coords.longitude.toFixed(3)
          }),
          () => resolve(null),
          {timeout: 8000, maximumAge: 300000}
        );
      });
    }

    function makePopup(stop, label) {
      const eventLink = stop.link && stop.link.startsWith('http')
        ? `<br><a href="${escapeHtml(stop.link)}" target="_blank" rel="noopener noreferrer">Event details</a>`
        : '';
      const directions = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(stop.name + ', New York, NY')}&travelmode=transit`;
      return `<b>${label}. ${escapeHtml(stop.name)}</b><br>` +
        (stop.time ? `${escapeHtml(stop.time)}<br>` : '') +
        `${escapeHtml(stop.why)}${eventLink}` +
        `<br><a href="${directions}" target="_blank" rel="noopener noreferrer">Directions</a>`;
    }

    function fitAll() {
      const pts = currentStops.map(s => [s.lat, s.lng]);
      if (currentLoc) pts.push([currentLoc.lat, currentLoc.lng]);
      if (pts.length) map.fitBounds(pts, {padding: [40, 40]});
    }

    async function getPlan() {
      const result = document.getElementById('result');
      const offBtn = document.getElementById('offroute-btn');
      result.textContent = 'Planning your day...';
      offBtn.style.display = 'none';
      markers.clearLayers();
      currentStops = [];

      currentLoc = await getLocation();

      const res = await fetch('/plan', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          ...getSettings(),
          lat: currentLoc ? currentLoc.lat : null,
          lng: currentLoc ? currentLoc.lng : null
        })
      });
      const data = await res.json();
      result.textContent = data.plan;

      if (data.weather) {
        document.getElementById('weather').textContent = `Right now in NYC: ${data.weather}`;
      }

      if (data.stops.length === 0) return;
      currentStops = data.stops;

      data.stops.forEach((stop, i) => {
        L.marker([stop.lat, stop.lng]).addTo(markers).bindPopup(makePopup(stop, i + 1));
      });
      L.polyline(data.stops.map(s => [s.lat, s.lng]), {dashArray: '6 8'}).addTo(markers);

      if (currentLoc) {
        L.circleMarker([currentLoc.lat, currentLoc.lng], {radius: 8, color: '#e63946', fillOpacity: 0.8})
          .addTo(markers)
          .bindPopup('You are here');
      }

      fitAll();
      offBtn.style.display = 'inline-block';
    }

    async function goOffRoute() {
      const btn = document.getElementById('offroute-btn');
      btn.disabled = true;
      btn.textContent = 'Finding a hidden gem...';

      try {
        const res = await fetch('/offroute', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            ...getSettings(),
            stops: currentStops.map(s => ({name: s.name, lat: s.lat, lng: s.lng}))
          })
        });
        const data = await res.json();

        if (data.gem) {
          currentStops.push(data.gem);
          L.circleMarker([data.gem.lat, data.gem.lng], {
            radius: 11, color: '#f4a261', fillColor: '#f4a261', fillOpacity: 0.9
          })
            .addTo(markers)
            .bindPopup(makePopup(data.gem, '★ Off route'))
            .openPopup();
          fitAll();
        } else {
          alert(data.error || 'Could not find a hidden gem right now. Try again!');
        }
      } finally {
        btn.disabled = false;
        btn.textContent = 'Take me off route';
      }
    }
  </script>
</body>
</html>
