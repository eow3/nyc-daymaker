<!DOCTYPE html>
<html>
<head>
  <title>NYC Daymaker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
  <h1>NYC Daymaker</h1>

  <div id="controls">
    <label>Mood
      <select id="mood">
        <option>chill</option><option>adventurous</option><option>social</option><option>creative</option>
      </select>
    </label>

    <label>Hours
      <input id="hours" type="number" value="3" min="1" max="12">
    </label>

    <label>Budget
      <select id="budget">
        <option value="free">Free</option>
        <option value="low" selected>$</option>
        <option value="medium">$$</option>
      </select>
    </label>

    <label>Who's coming
      <select id="group">
        <option value="solo">Just me</option>
        <option value="date">Date</option>
        <option value="friends">Friends</option>
        <option value="kids">With kids</option>
      </select>
    </label>

    <label>
      <input id="accessible" type="checkbox"> Step-free / wheelchair accessible
    </label>

    <button onclick="getPlan()">Plan my day</button>
  </div>

  <p id="weather"></p>
  <p id="result"></p>
  <div id="map"></div>

  <script>
    const map = L.map('map').setView([40.7128, -74.0060], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let markers = L.layerGroup().addTo(map);

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text ?? '';
      return div.innerHTML;
    }

    function getLocation() {
      return new Promise(resolve => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          pos => resolve({
            lat: +pos.coords.latitude.toFixed(3),
            lng: +pos.coords.longitude.toFixed(3)
          }),
          () => resolve(null),
          {timeout: 8000, maximumAge: 300000}
        );
      });
    }

    async function getPlan() {
      const result = document.getElementById('result');
      result.textContent = 'Planning your day...';
      markers.clearLayers();

      const loc = await getLocation();

      const res = await fetch('/plan', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          mood: document.getElementById('mood').value,
          hours: document.getElementById('hours').value,
          budget: document.getElementById('budget').value,
          group: document.getElementById('group').value,
          accessible: document.getElementById('accessible').checked,
          lat: loc ? loc.lat : null,
          lng: loc ? loc.lng : null
        })
      });
      const data = await res.json();
      result.textContent = data.plan;

      if (data.weather) {
        document.getElementById('weather').textContent = `Right now in NYC: ${data.weather}`;
      }

      if (data.stops.length === 0) return;

      const points = [];
      data.stops.forEach((stop, i) => {
        const point = [stop.lat, stop.lng];
        points.push(point);

        const eventLink = stop.link && stop.link.startsWith('http')
          ? `<br><a href="${escapeHtml(stop.link)}" target="_blank" rel="noopener noreferrer">Event details</a>`
          : '';
        const directions = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(stop.name + ', New York, NY')}&travelmode=transit`;

        L.marker(point)
          .addTo(markers)
          .bindPopup(
            `<b>${i + 1}. ${escapeHtml(stop.name)}</b><br>` +
            `${escapeHtml(stop.time)}<br>${escapeHtml(stop.why)}` +
            `${eventLink}<br><a href="${directions}" target="_blank" rel="noopener noreferrer">Directions</a>`
          );
      });

      L.polyline(points, {dashArray: '6 8'}).addTo(markers);

      const bounds = [...points];
      if (loc) {
        L.circleMarker([loc.lat, loc.lng], {radius: 8, color: '#e63946', fillOpacity: 0.8})
          .addTo(markers)
          .bindPopup('You are here');
        bounds.push([loc.lat, loc.lng]);
      }
      map.fitBounds(bounds, {padding: [40, 40]});
    }
  </script>
</body>
</html>
